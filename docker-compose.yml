services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minimind
      POSTGRES_USER: minimind
      POSTGRES_PASSWORD: change_me_in_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  gpu-worker:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://minimind:change_me_in_prod@postgres:5432/minimind
    depends_on:
      - postgres

volumes:
  pgdata:
